<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="LLM experiments: small, reproducible experiments on how LLM agents behave">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f2734f"/>
      <stop offset="1" stop-color="#a77bf0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="18" fill="#08090a"/>
  <rect width="1280" height="300" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="298.5" rx="17.5" fill="none" stroke="#2c322f" stroke-width="1.5"/>

  <text x="64" y="86" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" letter-spacing="3.5" fill="#8c958f">BERKE AKYILDIZ · <tspan fill="#f2734f">EXPERIMENTS</tspan></text>
  <text x="62" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#eef2ee">LLM experiments</text>
  <text x="64" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#8c958f">Small, reproducible experiments on how LLM agents behave.</text>
  <text x="64" y="244" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#8c958f">Real runs, every trace kept, plain-code checks wherever they can replace a judge.</text>

  <!-- a small trace motif: model call, tool calls, verdict -->
  <g transform="translate(940 96)" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
    <rect x="0" y="0" width="276" height="132" rx="12" fill="#121514" stroke="#2c322f"/>
    <rect x="18" y="20" width="18" height="18" rx="4" fill="#7445d6"/><rect x="46" y="25" width="120" height="8" rx="4" fill="#a98be8"/>
    <rect x="38" y="50" width="18" height="18" rx="4" fill="#c26a12"/><rect x="66" y="55" width="6" height="8" rx="3" fill="#e5a25a"/>
    <rect x="38" y="80" width="18" height="18" rx="4" fill="#c26a12"/><rect x="66" y="85" width="6" height="8" rx="3" fill="#e5a25a"/>
    <rect x="18" y="108" width="18" height="18" rx="4" fill="#7445d6"/><rect x="46" y="113" width="120" height="8" rx="4" fill="#a98be8"/>
    <rect x="186" y="104" width="74" height="24" rx="12" fill="#23110c" stroke="#f2613f"/>
    <text x="223" y="121" text-anchor="middle" fill="#ff9a80">FAIL</text>
    <rect x="186" y="16" width="74" height="24" rx="12" fill="#0e1d13" stroke="#3fcf6e"/>
    <text x="223" y="33" text-anchor="middle" fill="#8beaa8">PASS</text>
  </g>
  <rect x="64" y="268" width="180" height="3" rx="1.5" fill="url(#fade)"/>
</svg>
