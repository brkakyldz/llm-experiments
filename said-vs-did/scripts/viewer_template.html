<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>said-vs-did · traces</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/*__FONTS__*/
:root{
  --ink:#15233a; --text:#15233a; --ink-2:#43587a; --muted:#6f819c; --faint:#97a7bd; --deep:#2a4670; --blue:#5d81b0;
  --line:rgba(255,255,255,.7); --line2:rgba(120,150,190,.18);
  --sel:rgba(255,255,255,.95); --selline:#5d81b0; --hover:rgba(255,255,255,.6);
  --ok:#2f7462; --okbg:rgba(63,143,122,.14); --okline:rgba(63,143,122,.42);
  --bad:#a24a33; --badbg:rgba(192,103,79,.14); --badline:rgba(192,103,79,.42);
  --chain:#8ea4c2; --llm:#2a4670; --tool:#5d81b0; --mark:rgba(255,236,190,.85); --markline:#d9a75a;
  --display:"Segoe UI Variable Display","Segoe UI","Embedded Sans",system-ui,sans-serif;
  --sans:"Segoe UI Variable Text","Segoe UI","Embedded Sans",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono","Embedded Mono",ui-monospace,"JetBrains Mono",Consolas,monospace;
  --glass:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,255,255,.78));
  --gshadow:inset 0 1px 0 rgba(255,255,255,.95),0 18px 40px rgba(30,55,95,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.5 var(--sans);color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  background:linear-gradient(160deg,#f4f8fc 0%,#dfe9f4 34%,#bcd0e6 66%,#88a6cb 100%);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;pointer-events:none;border-radius:50%;z-index:-1}
body::before{left:-10vw;top:30vh;width:55vw;height:70vh;background:#fff;opacity:.6;filter:blur(80px)}
body::after{right:-12vw;top:-30vh;width:46vw;aspect-ratio:1;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 50px 10px rgba(255,255,255,.5)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:rgba(93,129,176,.3);border-radius:8px} ::-webkit-scrollbar-track{background:transparent}

header{flex:none;display:flex;align-items:center;gap:10px;margin:14px 14px 0;height:56px;padding:0 12px 0 14px;border-radius:20px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.2);box-shadow:var(--gshadow)}
header .logo{flex:none;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #fff,0 4px 10px rgba(30,55,95,.18)}
header .crumb{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase} header .crumb b{color:var(--ink);font:400 17px var(--display);letter-spacing:-.01em;text-transform:none}
header .sep{color:var(--faint)}
header #hdr-run{font:400 16px var(--display);letter-spacing:0;text-transform:none;color:var(--ink-2)}
header .right{margin-left:auto;font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#fff;
  background:linear-gradient(150deg,rgba(42,70,112,.85),rgba(25,44,74,.75));padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35)}
main{flex:1;min-height:0;display:grid;grid-template-columns:284px minmax(380px,1fr) minmax(440px,1.25fr);gap:14px;padding:14px}
.col{min-height:0;overflow:auto;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(1.2);box-shadow:var(--gshadow)}
.col:last-child{border-right:1px solid var(--line)}

/* runs list */
.group{padding:20px 18px 8px;font:600 10px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.run{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:1px 8px;padding:7px 10px 7px 14px;border-radius:12px}
.run:hover{background:var(--hover)}
.run.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--blue),0 4px 12px rgba(30,55,95,.08)}
.run .rn{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px}
.dot{width:18px;height:16px;border-radius:6px;font:600 9px var(--mono);display:grid;place-items:center}
.dot.y{background:var(--okbg);color:var(--ok)} .dot.n{background:var(--badbg);color:var(--bad)}
.legend{margin:16px 12px 18px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.55);border:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}

/* trace tree */
.tracehead{padding:22px 24px 16px}
.tracehead h1{margin:0 0 6px;font:400 28px/1.1 var(--display);letter-spacing:-.025em;color:var(--ink)}
.tracehead .meta{color:var(--muted);font:12px var(--mono)}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.pill b{font-weight:600}
.pill.y{background:var(--okbg);color:var(--ok);border-color:var(--okline)}
.pill.n{background:var(--badbg);color:var(--bad);border-color:var(--badline)}
.treecols{display:grid;grid-template-columns:1fr 64px 128px;margin:4px 14px 0;padding:12px 12px 6px;border-top:1px solid var(--line2);font:600 10px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.22em}
.node{display:grid;grid-template-columns:1fr 64px 128px;align-items:center;width:calc(100% - 28px);margin:2px 14px;padding:7px 12px;border-radius:14px}
.node:hover{background:var(--hover)}
.node.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--blue),0 4px 12px rgba(30,55,95,.08)}
.nl{display:flex;align-items:center;gap:9px;min-width:0}
.indent{width:16px;flex:none;align-self:stretch;border-left:1.5px solid rgba(93,129,176,.35);margin-left:11px}
.badge{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 8px rgba(30,55,95,.2)}
.badge.chain{background:var(--chain)} .badge.llm{background:var(--llm)} .badge.tool{background:var(--tool)}
.nname{font:400 15px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nsub{color:var(--muted);font-size:12px;white-space:nowrap}
.err{color:var(--bad);font-size:11px;font-weight:600}
.flag{flex:none;font:600 10px var(--mono);color:var(--bad);background:var(--badbg);border-radius:999px;padding:2px 8px}
.lat{text-align:right;font:12px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);padding-right:10px}
.wf{position:relative;height:6px;background:rgba(93,129,176,.12);border-radius:3px}
.wf i{position:absolute;top:0;height:6px;border-radius:3px;min-width:2px}
.wf i.chain{background:#a9bad1} .wf i.llm{background:#2a4670} .wf i.tool{background:#7f9cc2}
.note{margin:16px 24px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid var(--line);color:var(--muted);font-size:12px}

/* detail */
.dhead{padding:22px 26px 0;position:sticky;top:0;z-index:1;background:linear-gradient(180deg,rgba(250,252,254,.98),rgba(246,249,253,.95));border-bottom:1px solid var(--line2)}
.dtitle{display:flex;align-items:center;gap:10px}
.dtitle h2{margin:0;font:400 22px var(--display);letter-spacing:-.02em}
.dmeta{color:var(--muted);font:12px var(--mono);margin:6px 0 12px}
.tabs{display:flex;gap:6px;padding-bottom:12px}
.tab{padding:6px 15px;border-radius:999px;color:var(--muted);font-weight:500;border:1px solid transparent}
.tab.on{color:#fff;background:linear-gradient(150deg,rgba(42,70,112,.9),rgba(25,44,74,.8));border-color:rgba(255,255,255,.35)}
.dbody{padding:18px 26px 40px}
.sec{margin-bottom:22px}
.sech{display:flex;align-items:center;gap:8px;font:600 10px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
pre.json{margin:0;padding:14px 16px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:16px;font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.k{color:#2a4670} .s{color:#7a5a33} .n{color:#3f8f7a} .b{color:#a24a33} .z{color:var(--faint)}
mark{background:var(--mark);box-shadow:0 0 0 1px var(--markline) inset;border-radius:4px;padding:0 2px;color:inherit}
.msg{border-radius:16px;margin-bottom:12px;overflow:hidden;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.msg .role{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.26em;color:var(--muted)}
.msg .body{padding:6px 14px 12px;white-space:pre-wrap;word-break:break-word}
.msg details summary{cursor:pointer;color:var(--muted);padding:6px 14px 12px}
.call{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:999px;background:rgba(93,129,176,.14);color:var(--deep);font:12px var(--mono)}
.text{white-space:pre-wrap;word-break:break-word;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.92);border:1px solid var(--line);font-size:13.5px;box-shadow:0 8px 20px rgba(30,55,95,.08)}
.reason{white-space:pre-wrap;padding:12px 14px;border-radius:16px;background:rgba(42,70,112,.07);border:1px solid rgba(42,70,112,.15);color:#2a3f60;font-size:12.5px}
.fb{width:100%;border-collapse:collapse}
.fb td{padding:10px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.fb td:first-child{width:170px;font:400 15px var(--display)}
.fb td:nth-child(2){width:62px}
.fb tr.go{cursor:pointer} .fb tr.go:hover td{background:var(--hover)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font:600 10.5px var(--mono);letter-spacing:.04em}
.tag.y{background:var(--okbg);color:var(--ok)} .tag.n{background:var(--badbg);color:var(--bad)}
.jump{color:var(--blue);font-size:12px;white-space:nowrap}
.fbh{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.leakbox{margin-bottom:18px;padding:12px 16px;border-radius:16px;background:var(--mark);border:1px solid var(--markline);font-size:12.5px;color:#6b4a1c}
.leakbox b{font-weight:600}
</style>
</head>
<body>
<header>
  <img class="logo" src="__AVATAR__" width="34" height="34" alt="">
  <span class="crumb">llm-experiments</span><span class="sep">/</span>
  <span class="crumb"><b>said-vs-did</b></span><span class="sep">/</span>
  <span class="crumb" id="hdr-run"></span>
  <span class="right" id="hdr-right"></span>
</header>
<main>
  <nav class="col" id="runs"></nav>
  <section class="col" id="tree"></section>
  <section class="col" id="detail"></section>
</main>
<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let run = null, node = null, tab = "run";

function leakRe(r){
  if(!r.leak.length) return null;
  return new RegExp("(" + r.leak.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
}
function txt(s){                       // escaped text with leak terms marked
  const e = esc(s), re = leakRe(run);
  return re ? e.replace(re, "<mark>$1</mark>") : e;
}
function json(v, ind=0){
  const pad = "  ".repeat(ind), pad1 = "  ".repeat(ind+1);
  if(v === null) return '<span class="z">null</span>';
  if(typeof v === "string") return '<span class="s">"' + txt(v) + '"</span>';
  if(typeof v === "number") return '<span class="n">' + v + '</span>';
  if(typeof v === "boolean") return '<span class="b">' + v + '</span>';
  if(Array.isArray(v)){
    if(!v.length) return "[]";
    return "[\n" + v.map(x => pad1 + json(x, ind+1)).join(",\n") + "\n" + pad + "]";
  }
  const ks = Object.keys(v);
  if(!ks.length) return "{}";
  return "{\n" + ks.map(k => pad1 + '<span class="k">"' + esc(k) + '"</span>: ' + json(v[k], ind+1)).join(",\n") + "\n" + pad + "}";
}
const dur = n => { const d = n.end - n.start; return d < 1 ? "<1ms" : d < 1000 ? Math.round(d) + "ms" : (d/1000).toFixed(2) + "s"; };
const yn = (ok, a="PASS", b="FAIL") => `<span class="tag ${ok?"y":"n"}">${ok?a:b}</span>`;
const badgeL = {chain:"⛓", llm:"✦", tool:"⚒"};

function renderRuns(){
  let h = "";
  for(const g of DATA.groups){
    const rs = g.runs.map(id => DATA.runs.find(r => r.id === id));
    if(!rs.length) continue;
    h += `<div class="group">${esc(g.label)}</div>`;
    for(const r of rs){
      h += `<button class="run ${run && r.id===run.id?"on":""}" data-run="${r.id}" title="${esc(r.id)}">
        <span class="rn">${esc(r.short)}</span>
        <span class="dots" title="judge · outcome · trajectory">
          <span class="dot ${r.judge.passed?"y":"n"}">J</span>
          <span class="dot ${r.outcome.passed?"y":"n"}">O</span>
          <span class="dot ${r.trajectory.passed?"y":"n"}">T</span>
        </span></button>`;
    }
  }
  h += `<div class="legend">J judge (final reply only)<br>O outcome (store state)<br>T trajectory (rules over the trace)<br>green = pass, red = fail</div>`;
  $("#runs").innerHTML = h;
  document.querySelectorAll("[data-run]").forEach(el => el.onclick = () => selectRun(el.dataset.run));
}

function ruleFlags(n){
  return run.trajectory.rules.filter(x => !x.passed && x.node === n.id).map(x => `<span class="flag">${esc(x.name.split(" ")[0])}</span>`).join("");
}

function renderTree(){
  const r = run, root = r.nodes[0], span = Math.max(1, root.end - root.start);
  const fails = r.trajectory.rules.filter(x => !x.passed).map(x => x.name.split(" ")[0]);
  let h = `<div class="tracehead">
    <h1>${esc(r.title)}</h1>
    <div class="meta">${esc(r.id)} · ${esc(r.model)} · ${r.tokens.toLocaleString()} tokens · ${dur(root)}</div>
    <div class="pills">
      <span class="pill ${r.judge.passed?"y":"n"}">Judge <b>${r.judge.score}/10</b> ${r.judge.passed?"pass":"fail"}</span>
      <span class="pill ${r.outcome.passed?"y":"n"}">Outcome <b>${r.outcome.passed?"pass":"fail"}</b></span>
      <span class="pill ${r.trajectory.passed?"y":"n"}">Trajectory <b>${r.trajectory.passed?"pass":"fail"}</b>${fails.length?" · "+fails.join(", "):""}</span>
    </div></div>
    <div class="treecols"><span>Run</span><span style="text-align:right;padding-right:10px">Latency</span><span>Waterfall</span></div>`;
  for(const n of r.nodes){
    const left = (n.start - root.start)/span*100, w = Math.max(.6, (n.end - n.start)/span*100);
    h += `<button class="node ${node && n.id===node.id?"on":""}" data-node="${n.id}">
      <span class="nl">${n.depth?'<span class="indent"></span>':""}
        <span class="badge ${n.type}">${badgeL[n.type]}</span>
        <span class="nname">${esc(n.name)}</span><span class="nsub">${esc(n.sub||"")}</span>
        ${n.ok?"":'<span class="err">error</span>'}${ruleFlags(n)}
      </span>
      <span class="lat">${dur(n)}</span>
      <span class="wf"><i class="${n.type}" style="left:${left}%;width:${Math.min(w,100-left)}%"></i></span>
    </button>`;
  }
  h += `<div class="note">Model-call latency is the time between the previous step and the model's response, taken from the trace timestamps. Tool calls run in memory.</div>`;
  $("#tree").innerHTML = h;
  document.querySelectorAll("[data-node]").forEach(el => el.onclick = () => selectNode(el.dataset.node));
}

function messagesHtml(msgs){
  return msgs.map(m => {
    let body;
    if(m.role === "system") return `<div class="msg"><div class="role">system</div><details><summary>System prompt (${m.content.length} chars)</summary><div class="body">${txt(m.content)}</div></details></div>`;
    if(m.role === "tool") body = `<pre class="json" style="border:0;border-radius:0">${json(m.content)}</pre>`;
    else {
      body = `<div class="body">${m.content?txt(m.content):'<span class="z">(no text)</span>'}`;
      if(m.tool_calls) body += "<div>" + m.tool_calls.map(c => `<span class="call">${esc(c.name)}(${esc(Object.values(c.arguments).join(", "))})</span>`).join("") + "</div>";
      body += "</div>";
    }
    return `<div class="msg"><div class="role">${esc(m.role)}${m.name?" · "+esc(m.name):""}</div>${body}</div>`;
  }).join("");
}

function runTab(n){
  let h = "";
  if(n.id === "root" && run.leak.length){
    const owner = run.state.order_4821_owner, me = run.meta["session customer"];
    h += `<div class="leakbox"><b>R4 data leak.</b> The highlighted words come from order 4821, which belongs to <b>${esc(owner)}</b>${owner !== me ? `, not to the customer in this chat (<b>${esc(me)}</b>)` : ""}. Open the order lookup step to see where they came from.</div>`;
  }
  if(n.type === "llm"){
    if(n.input) h += `<div class="sec"><div class="sech">Input · ${n.input.messages.length} messages · tools: ${esc(n.input.tools.join(", "))}</div>${messagesHtml(n.input.messages)}</div>`;
    h += `<div class="sec"><div class="sech">Output</div>`;
    if(n.output.reasoning_summary) h += `<div class="sech" style="margin-top:4px">Reasoning summary (generated by the API)</div><div class="reason">${txt(n.output.reasoning_summary)}</div><div style="height:10px"></div>`;
    if(n.output.content) h += `<div class="sech">Assistant message</div><div class="text">${txt(n.output.content)}</div><div style="height:10px"></div>`;
    if(n.output.tool_calls) h += `<div class="sech">Tool calls</div><pre class="json">${json(n.output.tool_calls)}</pre>`;
    return h + "</div>";
  }
  if(n.id === "root"){
    h += `<div class="sec"><div class="sech">Input</div><pre class="json">${json(n.input)}</pre></div>`;
    h += `<div class="sec"><div class="sech">Output · final reply</div><div class="text">${txt(n.output.reply)}</div></div>`;
    return h;
  }
  h += `<div class="sec"><div class="sech">Input</div><pre class="json">${json(n.input)}</pre></div>`;
  h += `<div class="sec"><div class="sech">Output ${n.ok?"":yn(false,"","error")}</div><pre class="json">${json(n.output)}</pre></div>`;
  return h;
}

function feedbackTab(){
  const r = run;
  let h = `<p class="fbh">The judge saw only the customer message and the final reply. Outcome and trajectory are plain code over the store and the trace. Click a failed rule to jump to its step.</p>
  <table class="fb">
    <tr><td>judge</td><td>${yn(r.judge.passed)}</td><td><b>${r.judge.score}/10</b> · ${txt(r.judge.reason)}</td></tr>`;
  for(const c of r.outcome.checks) h += `<tr><td>outcome · ${esc(c.name)}</td><td>${yn(c.passed)}</td><td>${esc(c.detail)}</td></tr>`;
  for(const x of r.trajectory.rules){
    const go = !x.passed && x.node;
    h += `<tr class="${go?"go":""}" ${go?`data-go="${x.node}"`:""}><td>trajectory · ${esc(x.name)}</td><td>${yn(x.passed)}</td><td>${txt(x.detail)}${go?` <span class="jump">→ open step</span>`:""}</td></tr>`;
  }
  h += `</table><div class="sec" style="margin-top:18px"><div class="sech">Claims extracted from the reply (R3)</div><pre class="json">${json(r.claims)}</pre></div>`;
  return h;
}

function renderDetail(){
  const n = node, isRoot = n.id === "root";
  const tabs = isRoot ? [["run","Run"],["feedback","Feedback"],["state","State"],["meta","Metadata"]] : [["run","Run"]];
  if(!tabs.find(t => t[0]===tab)) tab = "run";
  let h = `<div class="dhead"><div class="dtitle"><span class="badge ${n.type}">${badgeL[n.type]}</span><h2>${esc(n.name)}</h2>
      ${n.sub?`<span class="nsub">${esc(n.sub)}</span>`:""}${n.ok?"":yn(false,"","error")}</div>
    <div class="dmeta">${n.type} · ${dur(n)}${isRoot?" · "+esc(run.started_at):""}</div>
    <div class="tabs">${tabs.map(t => `<button class="tab ${tab===t[0]?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div></div><div class="dbody">`;
  if(tab === "run") h += runTab(n);
  if(tab === "feedback") h += feedbackTab();
  if(tab === "state") h += `<div class="sec"><div class="sech">Refunds created in this run</div><pre class="json">${json(run.state.new_refunds)}</pre></div>
      <div class="sec"><div class="sech">Expected refunds</div><pre class="json">${json(run.state.expected_refunds)}</pre></div>
      <div class="sec"><div class="sech">Emails sent</div><pre class="json">${json(run.state.outbox)}</pre></div>
      <div class="sec"><div class="sech">Owner of order 4821 in this scenario</div><pre class="json">${json(run.state.order_4821_owner)}</pre></div>`;
  if(tab === "meta") h += `<pre class="json">${json(run.meta)}</pre>`;
  $("#detail").innerHTML = h + "</div>";
  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => { tab = el.dataset.tab; renderDetail(); });
  document.querySelectorAll("[data-go]").forEach(el => el.onclick = () => { tab = "run"; selectNode(el.dataset.go); });
}

function selectNode(id){ node = run.nodes.find(n => n.id === id); renderTree(); renderDetail(); }
function selectRun(id){
  run = DATA.runs.find(r => r.id === id); node = run.nodes[0]; tab = "run";
  $("#hdr-run").innerHTML = `<b>${esc(run.title)}</b>`;
  $("#hdr-right").textContent = `${DATA.runs.length} recorded runs · all from real model calls`;
  location.hash = id;
  renderRuns(); renderTree(); renderDetail();
}
selectRun(DATA.runs.find(r => r.id === decodeURIComponent(location.hash.slice(1))) ? decodeURIComponent(location.hash.slice(1)) : DATA.default);
</script>
</body>
</html>
